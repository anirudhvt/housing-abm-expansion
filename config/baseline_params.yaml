#placeholder parameters for initial test - run_calibration to see actual

simulation:
  n_households: 300
  # Landlord/investor counts are set so the initial rental stock lands on two
  # calibration targets at once:
  #   - institutional investors hold ~30% of the single-family rental stock
  #     (the metro Atlanta figure cited in the paper)
  #   - small landlords hold 2-10 units each (the paper's own definition)
  # With units_per_household 0.5, a 300-household run has 150 rental units:
  # 45 institutional (~12 each across ~4 investors) and 105 mom-and-pop
  # (~6 each across ~18 landlords).
  small_landlord_fraction: 0.058
  institutional_investor_fraction: 0.0125
  use_external_appreciation_data: false


initial_rental_stock:
  units_per_household: 0.5 #was 150/300
  # share of the initial rental stock handed to institutional investors; the
  # remainder goes to small landlords. Previously the initial stock was left
  # ownerless, so ~35% of all housing sat inert and untouchable by any policy.
  institutional_share: 0.30
 
initial_sale_stock: 
  units_per_household: 0.667 #was 200/300
  quality_mean: 1.0 #E[quality] across initial stock; price = tract.price_per_quality * quality
  quality_sigma: 0.45 #

wealth_eq1: #realistic, generated by Claude
  renter:
    alpha: 0.693 #PLACEHOLDER
    beta: 1.0 
    epsilon_std: 0.3  
  first_time_buyer:
    alpha: 1.099
    beta: 1.0
    epsilon_std: 0.3   
  repeat_buyer: 
    alpha: 1.792
    beta: 1.0
    epsilon_std: 0.3
  small_landlord: #placeholder, likely have more cash than owner occupiers
    alpha: 3.178
    beta: 1.0
    epsilon_std: 0.3


consumption_eq2:
  alpha: 0.5 

expenditure_eq3:
  alpha_household: 3.03
  alpha_institutional: 5.5
  beta: 0.3
  epsilon_std: 0.15

appreciation_eq4:
  alpha_household: 1.0
  alpha_institutional: 0.8

buy_rent_eq5:
  beta: 10
  tau: 0.1
  rent_income_fraction: 0.33

selling_eq6:
  tenure_years: 8
  alpha_stock: 4.0
  beta_rate: 5.0
  gamma_lockin: 2.0 #golden handcuffs

asking_price_eq7:
  alpha: 0.04
  beta: 0.011
  zeta: 0.032
  epsilon_std: 0.5

price_reduction_eq8:
  reduction_prob: 0.055
  epsilon_std: 0.08
  vacancy_tax_multiplier_investor: 1.5 #investor-held vacant listings reprice faster

rental_market:
  # frictional void between tenancies: a vacated unit needs cleaning, repair and
  # marketing before it can be re-let. With no void, turnover produces zero
  # measured vacancy because the rental market re-lets a unit in the same month
  # it is vacated. One month of void against an ~18-month average lease gives a
  # turnover vacancy rate in the ACS range for metro Atlanta (~7%).
  void_months: 1

market_clearing_a4: #appendix multi round auction mechanism
  bid_up_pct: 0.0075 #0.75% bid up per 7-day window
  arrival_window_days: 7.0
  month_days: 30.0
  max_multiplier: 3.0 #placeholder ceiling on single bid up round due to many ties
  round_floor: 5 #placeholder rounds

investor_yield_eq9_eq12: 
  delta_small_landlord: 0.3
  delta_institutional: 0.6
  kappa: 0.0631 #long term average rental yield
  policy_cost: 0.0 #not modeled yet
  # share of positive net rental cash flow institutional investors distribute to
  # shareholders each month. REIT structures must distribute ~90% of taxable
  # income; without any outflow investor capital compounds without bound and
  # their share of the rental stock never stops growing.
  institutional_payout_ratio: 0.9

investor_probs_eq10_eq13: 
  beta_small_landlord: 50.0
  beta_institutional: 50.0

rental_pricing_eq11:
  small_landlord:
    alpha: 0.0 
    beta: 0.0
    zeta: 1.0
    epsilon_std: 0.05
    reprice_prob: 0.6 #chance of repricing a vacant unit each month it sits empty
  institutional:
    premium: 1.04 #4% above market rate, no stickiness (EQ11 adaption)



mortgage_eq14:
  fha:
    chi_max_ltv: 0.965
    dti_front: 0.31
    term_months: 360
  conventional: 
    chi_max_ltv: 0.8
    dti_front: 0.28
    term_months: 360
  i_R_annual: 0.039

investor_dscr_eq15: #loan terms
  xi_icr: 1.25 #interest coverage ratio
  i_btl_monthly: 0.005 #but to let mortgage monthly rate

interest_rate_eq16: #3.6.2
  alpha: 0.00000002 #paper's own alpha is calibrated for a 10,000-household population, not this scale
  target_monthly_supply: 400000 #PLACEHOLDER target new mortgage lending/month
  spread_floor: -0.02
  spread_ceiling: 0.10


downpayment_eq17:
  first_time_buyer:
    d_minimum_pct: 0.035
    floor_share_p_floor: 0.55
    lognorm_m: -1.6
    lognorm_s: 0.5
  repeat_buyer: 
    d_minimum_pct: 0.2
    floor_share_p_floor: 0.55
    lognorm_m: -0.8
    lognorm_s: 0.75


downpayment_eq18:
  small_landlord: 
    d_minimum_pct: 0.2
    mu: 0.25
    sigma: 0.05
  institutional:
    d_minimum_pct: 0.3
    mu: 0.35
    sigma: 0.05
    p_cash: 0.6 #share of purchases that are all cash



repeat_buyer_promotion:
  min_tenure_months: 12 #PLACEHOLDER


income_distribution:
  # One lognormal for the household population, used for both the initial
  # cohort and every later entrant. Previously the initial cohort was drawn
  # from lognormal(8.6, 0.65) (median ~$5,430/mo, matching the ACS metro
  # Atlanta median) while entrants came from lognormal(8.9, 0.55)
  # (median ~$7,330/mo). As the initial cohort was replaced the population
  # drifted steadily richer, and homeownership drifted up with it -- a trend
  # in every reported outcome that had nothing to do with any policy.
  household_lognormal_mean: 8.6
  household_lognormal_sigma: 0.65
  small_landlord_lognormal_mean: 9.8
  small_landlord_lognormal_sigma: 0.5

household_budget:
  #netted out before considering disposable income
  essential_consumption_monthly: 1215 #estimated from 2026 poverty line

demographics: #section 3.2 placeholders
  birth_rate_annual: 0.01876 
  new_household_age_range: [22,35] #simplification, households enter as young adults
  mortality:
    base_annual_rate: 0.0005
    age_midpoint: 95
    age_scale: 6 #how sharpy hazard rises with age
    mortality_scale: 1.0 #placeholder

construction: #section 3.1 step 2 
  target_house_to_household_ratio: 1.098

fed_rate_process: #exogenous 30yr mortgage rate EQ 16
  mean_annual: 0.0453 
  monthly_presistence: 0.98
  monthly_noise_std: 0.0024


